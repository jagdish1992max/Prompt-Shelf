<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14160F">
<title>Gallery – PromptWala</title>
<meta name="description" content="AI images with the exact prompt behind each one. Tap an image, copy the prompt, try it in Gemini or ChatGPT.">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F0;--ink:#15170F;--card:#fff;--line:#DDE0D3;--muted:#62665A;--gold:#B8861B;--goldbg:rgba(184,134,27,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#0F100B;--ink:#F1EFE3;--card:#181A12;--line:#2B2E21;--muted:#A3A692;--gold:#D6A93C;--goldbg:rgba(214,169,60,.14)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,#12140D,#232A14 75%);color:#F4F1E4;padding:24px 16px 20px;border-radius:0 0 24px 24px}
.wrap{max-width:900px;margin:0 auto}
header a{color:#D6A93C;text-decoration:none;font-weight:600;font-size:.92rem}
h1{margin:8px 0 4px;font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.05;letter-spacing:-.02em}
header p{margin:0;color:#CFCDB9;max-width:56ch}
main{max-width:900px;margin:0 auto;padding:16px 12px 60px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.9rem;padding:8px 15px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1B1505}
.grid{columns:2;column-gap:10px}
@media(min-width:700px){.grid{columns:3}}
.tile{break-inside:avoid;margin:0 0 10px;position:relative;border-radius:16px;overflow:hidden;border:0;background:var(--card);cursor:pointer;padding:0;display:block;width:100%}
.tile img{display:block;width:100%;height:auto}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 9px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:.8rem;font-weight:600;text-align:left}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.empty{padding:30px 0;color:var(--muted)}
.modal{position:fixed;inset:0;background:var(--bg);display:none;overflow-y:auto;z-index:10}
.modal.open{display:block}
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--ink);cursor:pointer;padding:6px 4px}
.bar b{color:var(--gold)}
.det{max-width:560px;margin:0 auto;padding:14px 14px 50px}
.hero{border-radius:20px;overflow:hidden;background:#000}
.hero img{display:block;width:100%;max-height:75vh;object-fit:contain}
.acts{display:flex;align-items:center;gap:8px;margin:14px 0}
.try{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;padding:12px 14px;border-radius:14px;border:1px solid var(--gold);background:var(--goldbg);color:var(--ink);cursor:pointer}
.ico{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
.ico svg,.try svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.on svg{fill:var(--gold);stroke:var(--gold)}
.ico.done{border-color:var(--gold);color:var(--gold)}
.pick{display:none;gap:8px;margin:0 0 14px}.pick.show{display:flex}
.pick a{flex:1;text-align:center;font-weight:600;padding:11px;border-radius:12px;background:var(--gold);color:#1B1505;text-decoration:none}
.hint{margin:-6px 0 14px;font-size:.84rem;color:var(--muted)}
.cat{display:inline-block;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--gold);background:var(--goldbg);padding:3px 10px;border-radius:99px}
.det h2{margin:8px 0 14px;font-size:1.4rem;line-height:1.2}
.det h3{margin:0 0 6px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ptxt{margin:0 0 16px;white-space:pre-wrap;font-size:1rem}
mark{background:var(--goldbg);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line);padding-top:12px}
.full{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:20}
.full.open{display:flex}.full img{max-width:100%;max-height:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;display:none;z-index:30;max-width:90%;text-align:center}
.toast.show{display:block}
</style>
</head>
<body>
<header><div class="wrap">
  <a href="./">← PromptWala</a>
  <h1>Gallery</h1>
  <p>Image par tap karo, uska poora prompt mil jaayega. Copy karo ya seedha Gemini ya ChatGPT me try karo.</p>
</div></header>
<main>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Image prompt"></div>
<div class="full" id="full"><img id="fimg" alt=""></div>
<div class="toast" id="toast" role="status"></div>
<script src="gallery-data.js"></script>
<script>
(function(){
var G=(typeof GALLERY!=="undefined")?GALLERY.slice().reverse():[],cat="All",last=null,cur=null;
var chips=document.getElementById("chips"),grid=document.getElementById("grid"),modal=document.getElementById("modal"),full=document.getElementById("full"),fimg=document.getElementById("fimg"),toast=document.getElementById("toast");
var FAV=[];try{FAV=JSON.parse(localStorage.getItem("pw_gfav")||"[]")}catch(e){}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function idOf(x){return x.img.replace(/\.[a-z]+$/i,"")}
var I={dl:'<svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg>',sh:'<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="17" cy="6" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M8.2 10.8l6.6-3.6M8.2 13.2l6.6 3.6"/></svg>',cp:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>',fs:'<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',hr:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',sp:'<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></svg>'};
var cats=["All"];G.forEach(function(x){if(cats.indexOf(x.c)<0)cats.push(x.c)});
function drawChips(){chips.innerHTML="";if(cats.length<3)return;cats.forEach(function(c){var b=document.createElement("button");b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c===cat);b.onclick=function(){cat=c;drawChips();draw()};chips.appendChild(b)})}
function draw(){
  grid.innerHTML="";var list=G.filter(function(x){return cat==="All"||x.c===cat});
  if(!list.length){grid.style.columns="auto";grid.innerHTML='<p class="empty">Abhi koi image nahi hai. Jaldi hi aayengi.</p>';return}
  grid.style.columns="";
  list.forEach(function(x){var b=document.createElement("button");b.className="tile";b.setAttribute("aria-label",x.t+" – prompt dekho");
    b.innerHTML='<img loading="lazy" src="'+esc(x.img)+'" alt="'+esc(x.t)+'"><span>'+esc(x.t)+'</span>';
    b.onclick=function(){last=b;open(x)};grid.appendChild(b)})
}
function say(m){toast.textContent=m;toast.classList.add("show");clearTimeout(say.t);say.t=setTimeout(function(){toast.classList.remove("show")},2200)}
function copyText(t,ok){function done(){ok&&ok()}function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(a)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb()}
function open(x,keep){
  cur=x;var link=location.href.split("#")[0]+"#"+idOf(x);
  var date="";var dv=x.date||x.d;if(dv){var d=new Date(dv+"T12:00:00");if(!isNaN(d))date=d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
  var meta=[];if(x.tool)meta.push("Made with "+esc(x.tool));if(date)meta.push(date);
  modal.innerHTML='<div class="bar"><button id="back">← Gallery</button><b>PromptWala</b></div><div class="det"><div class="hero"><img src="'+esc(x.img)+'" alt="'+esc(x.t)+'"></div>'+
   '<div class="acts"><button class="try" id="try">'+I.sp+'Try this prompt</button><a class="ico" id="dl" href="'+esc(x.img)+'" download aria-label="Image download karo">'+I.dl+'</a><button class="ico" id="sh" aria-label="Share">'+I.sh+'</button><button class="ico" id="cp" aria-label="Prompt copy karo">'+I.cp+'</button><button class="ico" id="fs" aria-label="Poori screen">'+I.fs+'</button><button class="ico'+(FAV.indexOf(idOf(x))>-1?" on":"")+'" id="hr" aria-label="Save karo">'+I.hr+'</button></div>'+
   '<div class="pick" id="pick"><a href="https://gemini.google.com/app" target="_blank" rel="noopener" data-n="Gemini">Gemini kholo</a><a href="https://chatgpt.com/" target="_blank" rel="noopener" data-n="ChatGPT">ChatGPT kholo</a></div><p class="hint" id="hint" hidden>Prompt copy ho gaya hai. AI me paste karo.</p>'+
   '<span class="cat">'+esc(x.c)+'</span><h2>'+esc(x.t)+'</h2><h3>Prompt</h3><p class="ptxt">'+esc(x.p).replace(/\[([^\]]+)\]/g,"<mark>[$1]</mark>")+'</p>'+(meta.length?'<div class="meta"><span>'+meta.join('</span><span>')+'</span></div>':'')+'</div>';
  document.getElementById("back").onclick=close;
  document.getElementById("try").onclick=function(){copyText(x.p,function(){document.getElementById("pick").classList.add("show");document.getElementById("hint").hidden=false;say("Prompt copy ho gaya")})};
  var cp=document.getElementById("cp");cp.onclick=function(){copyText(x.p,function(){cp.classList.add("done");say("Prompt copy ho gaya");setTimeout(function(){cp.classList.remove("done")},1500)})};
  document.getElementById("sh").onclick=function(){var text=x.t+"\n\n"+x.p+"\n\nDekho: "+link;if(navigator.share){navigator.share({title:x.t+" - PromptWala",text:text}).catch(function(){})}else{window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank")}};
  document.getElementById("fs").onclick=function(){fimg.src=x.img;full.classList.add("open")};
  var hr=document.getElementById("hr");hr.onclick=function(){var k=idOf(x),i=FAV.indexOf(k);if(i>-1){FAV.splice(i,1);hr.classList.remove("on")}else{FAV.push(k);hr.classList.add("on")}try{localStorage.setItem("pw_gfav",JSON.stringify(FAV))}catch(e){}};
  modal.classList.add("open");modal.scrollTop=0;document.body.style.overflow="hidden";
  if(!keep){try{history.replaceState(null,"","#"+idOf(x))}catch(e){}}
}
function close(){modal.classList.remove("open");document.body.style.overflow="";try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}if(last)last.focus()}
full.onclick=function(){full.classList.remove("open")};
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(full.classList.contains("open"))full.classList.remove("open");else if(modal.classList.contains("open"))close()}});
drawChips();draw();
var h=location.hash.replace("#","");if(h){G.forEach(function(x){if(idOf(x)===h)open(x,true)})}
})();
</script>
</body>
</html>
