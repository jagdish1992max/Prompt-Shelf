<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptWala – ready AI prompts for creators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F1;--ink:#1A1A16;--accent:#556B2F;--mint:#F3DE9B;--line:#D6D8D0;--card:#fff;--muted:#5f6157}
@media (prefers-color-scheme:dark){:root{--bg:#141512;--ink:#F2F0E6;--accent:#D9AE4A;--mint:#4A5A25;--line:#2c2e27;--card:#1c1d19;--muted:#aaa99b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:40px 18px 80px}
.top{display:flex;align-items:center;gap:16px;margin:0 0 14px}.avatar{width:clamp(84px,22vw,130px);height:auto;aspect-ratio:1;object-fit:cover;border-radius:50% 50% 50% 12px;border:4px solid var(--mint);flex:none}
h1{font-size:clamp(2.2rem,9vw,4.4rem);font-weight:800;line-height:1;margin:0;letter-spacing:-.03em}
.sub{max-width:52ch;color:var(--muted);margin:0 0 28px;font-size:1.05rem}
.search{width:100%;padding:14px 16px;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px}
.search:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 26px}
.chip{font:inherit;font-size:.92rem;padding:7px 14px;border-radius:99px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.list{display:grid;gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--accent);border-radius:6px 16px 16px 6px;padding:18px 18px 16px}
.card h2{font-size:1.2rem;margin:0 0 2px}
.cat{font-size:.85rem;color:var(--muted);margin:0 0 10px}
.text{margin:0 0 14px;white-space:pre-wrap;font-size:.98rem}
mark{background:var(--mint);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.copy{font:inherit;font-weight:600;padding:9px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){.copy{color:#141512}}
.copy.done{background:var(--mint);color:var(--ink)}
.empty{padding:30px 0;color:var(--muted)}
footer{margin-top:40px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <div class="top"><img class="avatar" src="character.jpg" alt="PromptWala channel character" width="120" height="120"><div><h1>PromptWala</h1><p class="sub">Ready-made AI prompts for creators. Copy a prompt, replace the highlighted [brackets] with your own details, and paste it into any AI.</p></div></div>
  <input class="search" id="q" type="search" placeholder="Search prompts, e.g. title, thumbnail" aria-label="Search prompts">
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
  <footer>Add your own prompts by editing the <code>PROMPTS</code> list in index.html.</footer>
</main>
<script src="prompts1.js"></script>
<script src="prompts2.js"></script>
<script>
if(typeof PROMPTS==="undefined"){PROMPTS=[]}
var cat="All",term="";
var chips=document.getElementById("chips"),list=document.getElementById("list"),q=document.getElementById("q");
var cats=["All"];PROMPTS.forEach(function(x){if(cats.indexOf(x.c)<0)cats.push(x.c)});
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function renderChips(){chips.innerHTML="";cats.forEach(function(c){var b=document.createElement("button");b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c===cat);b.onclick=function(){cat=c;renderChips();render()};chips.appendChild(b)})}
function render(){
  var out=PROMPTS.filter(function(x){return(cat==="All"||x.c===cat)&&(x.t+" "+x.p+" "+x.c).toLowerCase().indexOf(term)>-1});
  list.innerHTML="";
  if(!PROMPTS.length){list.innerHTML='<p class="empty">Prompts load nahi hue. Repo me prompts1.js aur prompts2.js upload karo.</p>';return}
  if(!out.length){list.innerHTML='<p class="empty">No prompts match. Try a shorter word or pick All.</p>';return}
  out.forEach(function(x){
    var d=document.createElement("article");d.className="card";
    d.innerHTML='<h2>'+esc(x.t)+'</h2><p class="cat">'+esc(x.c)+'</p><p class="text">'+esc(x.p).replace(/\[([^\]]+)\]/g,'<mark>[$1]</mark>')+'</p>';
    var b=document.createElement("button");b.className="copy";b.textContent="Copy prompt";
    b.onclick=function(){copy(x.p,b)};d.appendChild(b);list.appendChild(d)
  })
}
function copy(text,b){
  function ok(){b.textContent="Copied";b.classList.add("done");setTimeout(function(){b.textContent="Copy prompt";b.classList.remove("done")},1600)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fallback)}else fallback();
  function fallback(){var t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(t)}
}
q.oninput=function(){term=q.value.toLowerCase().trim();render()};
renderChips();render();
</script>
</body>
</html>
