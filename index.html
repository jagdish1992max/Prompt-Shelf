<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14160F">
<title>PromptWala – Free AI prompts for creators</title>
<meta name="description" content="Copy-ready AI prompts for images, videos, festivals and your own photos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F0;--ink:#15170F;--card:#fff;--line:#DDE0D3;--muted:#62665A;--accent:#4F6228;--gold:#B8861B;--goldbg:rgba(184,134,27,.14);--mint:rgba(184,134,27,.22)}
@media (prefers-color-scheme:dark){:root{--bg:#0F100B;--ink:#F1EFE3;--card:#181A12;--line:#2B2E21;--muted:#A3A692;--accent:#D6A93C;--gold:#D6A93C;--goldbg:rgba(214,169,60,.14);--mint:rgba(214,169,60,.25)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
.hero{background:radial-gradient(900px 300px at 85% -10%,rgba(214,169,60,.28),transparent 60%),linear-gradient(135deg,#12140D,#232A14 75%);color:#F4F1E4;border-radius:0 0 28px 28px;padding:34px 18px 26px}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;gap:18px;align-items:center}
.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #D6A93C;box-shadow:0 0 0 6px rgba(214,169,60,.18),0 10px 30px rgba(0,0,0,.4);flex:none}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#D6A93C;margin:0 0 4px;font-weight:600}
h1{font-size:clamp(2.1rem,8.5vw,3.6rem);font-weight:800;line-height:1;margin:0;letter-spacing:-.03em}
h1 span{color:#D6A93C}
.sub{margin:18px 0 0;max-width:56ch;color:#CFCDB9;font-size:1.02rem}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 16px;font-size:.88rem;color:#CFCDB9}
.stat b{display:block;font-size:1.35rem;color:#F4F1E4;line-height:1.1}
main{max-width:900px;margin:0 auto;padding:22px 16px 70px}
.search{width:100%;padding:14px 16px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px}
.search:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.chips::-webkit-scrollbar{display:none}
.groups{margin-top:14px}.sub2{margin:0 0 14px}
.chip{flex:none;font:inherit;font-size:.9rem;padding:8px 15px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.groups .chip{font-weight:600}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1B1505}
.list{display:grid;gap:14px;margin-top:6px}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
.card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card .cat{order:-1;align-self:flex-start;margin:0;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--gold);background:var(--goldbg);padding:3px 10px;border-radius:99px}
.card h2{margin:0;font-size:1.12rem;line-height:1.25}
.card .text{margin:0;white-space:pre-wrap;font-size:.94rem;color:var(--muted);flex:1}
mark{background:var(--mint);color:var(--ink);padding:1px 5px;border-radius:5px;font-weight:600}
.copy{align-self:flex-start;font:inherit;font-weight:600;padding:9px 18px;border:0;border-radius:10px;background:var(--gold);color:#1B1505;cursor:pointer}
.copy.done{background:var(--accent);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}.card .copy{align-self:auto}.copy.share{background:transparent;color:var(--ink);border:1px solid var(--line)}.copy.share:hover{border-color:var(--gold)}
.gen .chips{flex-wrap:wrap;overflow:visible}
.empty{padding:30px 0;color:var(--muted)}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;text-align:center}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="top">
    <img class="avatar" src="character.jpg" alt="PromptWala channel character" width="92" height="92">
    <div><p class="eyebrow">Free prompt library</p><h1>Prompt<span>Wala</span></h1></div>
  </div>
  <p class="sub">Copy-ready AI prompts for images, videos, festivals and your own photos. Copy a prompt, replace the highlighted [brackets] with your details, and paste it into any AI.</p>
  <div class="stats"><div class="stat"><b id="sp">0</b>prompts</div><div class="stat"><b id="sc">0</b>categories</div><div class="stat"><b>Free</b>forever</div></div>
</div></header>
<main>
  <section id="gen"></section>
  <input class="search" id="q" type="search" placeholder="Search prompts, e.g. Navratri, thumbnail, anime" aria-label="Search prompts">
  <div class="chips groups" id="groups"></div>
  <div class="chips sub2" id="chips"></div>
  <div class="list" id="list"></div>
  <footer>PromptWala · Made for creators · New prompts added regularly</footer>
</main>
<script src="prompts1.js"></script>
<script src="prompts2.js"></script>
<script src="prompts3.js"></script>
<script src="prompts4.js"></script>
<script src="prompts5.js"></script>
<script src="prompts6.js"></script>
<script src="prompts8.js"></script>
<script src="prompts9.js"></script>
<script src="prompts10.js"></script>
<script src="prompts11.js"></script>
<script src="prompts7.js"></script>
<script src="gen.js"></script>
<script>
if(typeof PROMPTS==="undefined"){PROMPTS=[]}
var grp="All",cat="All",term="";
var GROUPS=[["Navratri",["Navratri Devi","Navratri Me","Navratri Content"]],["Trending Now",["Trending Now"]],["Diwali & Dussehra",["Diwali Images","Diwali Me","Dussehra","Diwali Content"]],["Image Generator",["Image Gen","Characters","Visuals","Prompt Tools"]],["My Photo",["Portrait Looks", "Art Styles", "Roles", "Travel Me", "Festive Me", "Devotional Me", "Channel Me", "Fashion Me", "Video Me"]],["Video Generator",["Video Gen","Action Video","Action Me","Horror Video","Comedy Video","Romantic Video","Sci-Fi Video"]],["Devotional",["Devotional"]],["Festival",["Festival"]],["YouTube & Content",["YouTube","Reels","Hinglish","Editing","Planning","Community","Growth"]],["Branding",["Branding"]]];
var c2g={};GROUPS.forEach(function(g){g[1].forEach(function(c){c2g[c]=g[0]})});
PROMPTS.forEach(function(x){if(!c2g[x.c]){c2g[x.c]="Other"}});
var gnames=["All"];GROUPS.forEach(function(g){gnames.push(g[0])});if(PROMPTS.some(function(x){return c2g[x.c]==="Other"}))gnames.push("Other");
var groupsEl=document.getElementById("groups"),chips=document.getElementById("chips"),list=document.getElementById("list"),q=document.getElementById("q");
function count(g){return PROMPTS.filter(function(x){return g==="All"||c2g[x.c]===g}).length}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function mk(parent,label,on,fn){var b=document.createElement("button");b.className="chip";b.textContent=label;b.setAttribute("aria-pressed",on);b.onclick=fn;parent.appendChild(b)}
function renderChips(){
  groupsEl.innerHTML="";chips.innerHTML="";
  gnames.forEach(function(g){mk(groupsEl,g+" ("+count(g)+")",g===grp,function(){grp=g;cat="All";renderChips();render()})});
  if(grp==="All")return;
  var subs=[];PROMPTS.forEach(function(x){if(c2g[x.c]===grp&&subs.indexOf(x.c)<0)subs.push(x.c)});
  if(subs.length<2)return;
  ["All"].concat(subs).forEach(function(c){mk(chips,c,c===cat,function(){cat=c;renderChips();render()})})
}
function render(){
  var out=PROMPTS.filter(function(x){return(grp==="All"||c2g[x.c]===grp)&&(cat==="All"||x.c===cat)&&(x.t+" "+x.p+" "+x.c).toLowerCase().indexOf(term)>-1});
  list.innerHTML="";
  if(!PROMPTS.length){list.innerHTML='<p class="empty">Prompts load nahi hue. Repo me prompts1.js aur prompts2.js upload karo.</p>';return}
  if(!out.length){list.innerHTML='<p class="empty">No prompts match. Try a shorter word or pick All.</p>';return}
  out.forEach(function(x){
    var d=document.createElement("article");d.className="card";
    d.innerHTML='<h2>'+esc(x.t)+'</h2><p class="cat">'+esc(x.c)+'</p><p class="text">'+esc(x.p).replace(/\[([^\]]+)\]/g,'<mark>[$1]</mark>')+'</p>';
    var b=document.createElement("button");b.className="copy";b.textContent="Copy prompt";
    b.onclick=function(){copy(x.p,b)};
    var sh=document.createElement("button");sh.className="copy share";sh.textContent="Share";sh.onclick=function(){share(x)};
    var w=document.createElement("div");w.className="btns";w.appendChild(b);w.appendChild(sh);d.appendChild(w);list.appendChild(d)
  })
}
function share(x){
  var link=location.href.split("#")[0],text=x.t+"\n\n"+x.p+"\n\nMore free prompts: "+link;
  if(navigator.share){navigator.share({title:x.t+" - PromptWala",text:text}).catch(function(){})}
  else{window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank")}
}
function copy(text,b){
  function ok(){b.textContent="Copied";b.classList.add("done");setTimeout(function(){b.textContent="Copy prompt";b.classList.remove("done")},1600)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fallback)}else fallback();
  function fallback(){var t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(t)}
}
q.oninput=function(){term=q.value.toLowerCase().trim();render()};
renderChips();render();
var sp=document.getElementById("sp"),sc=document.getElementById("sc");if(sp){sp.textContent=PROMPTS.length}if(sc){var u=[];PROMPTS.forEach(function(x){if(u.indexOf(x.c)<0)u.push(x.c)});sc.textContent=u.length}
</script>
</body>
</html>
